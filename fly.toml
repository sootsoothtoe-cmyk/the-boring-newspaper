# fly.toml app configuration file generated for the-boring-newspaper on 2026-02-14T23:58:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'the-boring-newspaper'
primary_region = 'iad'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
